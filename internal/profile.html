<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>โปรไฟล์พนักงาน | Kumtsu Internal</title><base href="/internal/"><link rel="stylesheet" href="./styles.css"></head>
<body>
  <header class="internal-header"><a class="internal-brand" href="/"><img src="https://kumtsu-group-profile.kumtsu-7034.chatgpt.site/assets/kumtsu.png" alt="โลโก้คุ้มสึ"><span>คุ้มสึ<small>KUMTSU INTERNAL</small></span></a><div class="internal-actions"><a id="adminLink" class="login-link" href="./admin/" hidden>Admin</a><div class="user-chip"><strong id="headerName">กำลังโหลด…</strong><span id="headerEmployee"></span></div><button id="logoutButton" class="logout-button" type="button">ออกจากระบบ</button></div></header>
  <main class="profile-main"><div class="profile-top"><div><p class="eyebrow">INTERNAL MEMBER</p><h1>โปรไฟล์ของฉัน</h1></div><p class="intro-copy">ตรวจสอบและอัปเดตข้อมูลสำหรับการติดต่อภายในองค์กร</p></div>
    <section class="form-card profile-card" aria-labelledby="profileTitle">
      <div class="avatar-panel"><img id="avatarPreview" class="avatar-preview" src="./profile-placeholder.svg" alt="รูปโปรไฟล์"><input class="avatar-input" id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp"><label class="avatar-button" for="avatarInput">เลือกรูปโปรไฟล์</label><p class="avatar-help">JPG, PNG หรือ WEBP<br>ขนาดไม่เกิน 5 MB</p></div>
      <form id="profileForm"><h2 id="profileTitle">ข้อมูลสมาชิก</h2><div class="field-grid two-columns"><label class="field"><span>ชื่อ</span><input name="firstName" maxlength="80" required></label><label class="field"><span>นามสกุล</span><input name="lastName" maxlength="80" required></label></div><div class="field-grid two-columns"><label class="field"><span>รหัสพนักงาน</span><input class="readonly" name="employeeId" readonly></label><label class="field"><span>แผนก/ฝ่าย</span><input name="department" maxlength="100" required></label></div><div class="field-grid two-columns"><label class="field"><span>อีเมลองค์กร</span><input class="readonly" name="email" readonly></label><label class="field"><span>เบอร์โทรศัพท์ภายใน</span><input name="internalPhone" maxlength="30"></label></div><div class="form-actions"><p>รหัสพนักงานและอีเมลแก้ไขได้โดยฝ่าย IT เท่านั้น</p><button type="submit">บันทึกโปรไฟล์ →</button></div><div id="profileResult" class="form-result" hidden></div></form>
    </section>
  </main><script type="module" src="./profile.js"></script>
</body></html>
