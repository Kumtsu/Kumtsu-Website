<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ตัวอย่างฟอร์มเพิ่มแบรนด์และช่องทางขาย | Kumtsu</title>
  <base href="/internal/">
  <link rel="stylesheet" href="./branch-access.css">
  <script type="importmap">{"imports":{"/internal/auth.js":"/internal/branch-access-preview-auth.js"}}</script>
</head>
<body>
  <header class="topbar">
    <span class="brand"><span class="brand-mark">K</span><span>KUMTSU <small>BRANCH ACCESS · PREVIEW</small></span></span>
    <div class="top-actions"><span id="adminBadge" class="admin-badge" hidden>ตัวอย่าง Admin</span><span id="userName" class="user-name"></span></div>
  </header>
  <aside class="security-note" role="note" style="margin:0 auto;padding-top:18px;padding-bottom:18px"><strong>ตัวอย่างก่อนเผยแพร่</strong><span>ทดลองเลือกแบรนด์/ช่องทางและกดบันทึกได้ ใช้ข้อมูลตัวอย่างเท่านั้น ข้อมูลจะหายเมื่อรีเฟรชหน้า</span></aside>
  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-heading"><p class="eyebrow">BRANCH DIRECTORY</p><h1>ข้อมูลเข้าสู่ระบบ<br><span>ทุกสาขา</span></h1><p id="branchCount" class="muted"></p><button id="addBranchButton" class="button primary add-button admin-only" type="button" hidden>+ เพิ่มสาขา</button></div>
      <label class="search-field"><span>ค้นหาสาขา</span><input id="branchSearch" type="search" placeholder="ชื่อหรือรหัสสาขา" autocomplete="off"></label>
      <nav id="branchList" class="branch-list" aria-label="รายชื่อสาขา"></nav>
    </aside>
    <section class="content">
      <div id="loadingState" class="state-card">กำลังโหลดตัวอย่าง…</div><div id="errorState" class="state-card error" hidden></div>
      <div id="branchView" hidden>
        <section class="branch-hero"><div><p id="branchCode" class="eyebrow"></p><h2 id="branchName"></h2><p id="branchAddress" class="branch-address"></p></div><button id="editBranchButton" class="button secondary admin-only" type="button" hidden>แก้ไขข้อมูลสาขา</button></section>
        <div class="branch-meta"><a id="branchPhone" class="meta-card" href="#"><span>โทรศัพท์</span><strong></strong></a><a id="branchMap" class="meta-card" href="#" target="_blank" rel="noreferrer"><span>แผนที่</span><strong>เปิดพิกัด ↗</strong></a></div>
        <section class="section-heading"><div><p class="eyebrow">ACCOUNTS</p><h3>แบรนด์และช่องทางขาย</h3></div><div class="section-actions"><p id="accountSummary" class="muted"></p><button id="addBrandButton" class="button primary admin-only" type="button" hidden>+ เพิ่มแบรนด์</button></div></section>
        <div id="brandList" class="brand-grid"></div>
      </div>
    </section>
  </main>
  <dialog id="editDialog" class="edit-dialog"><form id="editForm" method="dialog">
    <div class="dialog-head"><div><p id="dialogMode" class="eyebrow">ADMIN CREATE</p><h2 id="editTitle"></h2></div><button class="icon-button" type="button" data-close-dialog aria-label="ปิด">×</button></div>
    <p id="formContext" class="form-context" hidden></p><div id="editFields" class="edit-fields"></div><div id="editError" class="form-error" hidden></div>
    <div class="dialog-actions"><button class="button secondary" type="button" data-close-dialog>ยกเลิก</button><button id="saveButton" class="button primary" type="submit">บันทึกข้อมูล</button></div>
  </form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="./branch-access-catalog.js"></script>
  <script type="module">
    if (HTMLScriptElement.supports?.('importmap')) {
      import('./branch-access.js');
    } else {
      document.querySelector('#loadingState').textContent = 'กรุณาใช้เบราว์เซอร์เวอร์ชันใหม่เพื่อเปิดตัวอย่างนี้';
    }
  </script>
</body>
</html>
