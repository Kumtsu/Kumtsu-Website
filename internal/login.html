<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>เข้าสู่ระบบ | Kumtsu Internal</title><base href="/internal/"><link rel="stylesheet" href="./styles.css"></head>
<body>
  <header class="internal-header"><a class="internal-brand" href="./"><img src="https://kumtsu-group-profile.kumtsu-7034.chatgpt.site/assets/kumtsu.png" alt="โลโก้คุ้มสึ"><span>คุ้มสึ<small>KUMTSU INTERNAL</small></span></a><a class="back-link" href="./">ขอสิทธิ์ใช้งาน</a></header>
  <main class="auth-shell"><section class="auth-card"><p class="eyebrow">MEMBER LOGIN</p><h1>เข้าสู่ระบบ</h1><p class="intro-copy">สำหรับสมาชิกและพนักงานคุ้มสึที่ได้รับอนุมัติแล้ว</p>
    <form id="loginForm"><label class="field"><span>อีเมลองค์กร</span><input name="email" type="email" autocomplete="username" placeholder="name@kumtsu.com" required></label><label class="field"><span>รหัสผ่าน</span><input name="password" type="password" autocomplete="current-password" minlength="10" required></label><div class="form-actions"><button type="submit">เข้าสู่ระบบ →</button></div><div id="result" class="form-result" hidden></div></form><a class="text-link" href="./forgot-password.html">ลืมรหัสผ่าน?</a>
  </section></main><aside class="security-warning public-warning" role="note" aria-label="คำเตือนความปลอดภัย"><span class="warning-icon" aria-hidden="true">!</span><div><strong>คำเตือนด้านความปลอดภัย</strong><p>ห้ามเผยแพร่ข้อมูลภายในโดยเด็ดขาด ข้อมูลทั้งหมดในส่วนนี้จัดทำขึ้นสำหรับใช้งานภายในองค์กรเท่านั้น</p></div></aside><script type="module" src="./login.js"></script>
</body></html>
